name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version override (e.g. 0.3.1). Leave empty to read the version from gnn-ipinfo.php.'
        required: false
        default: ''
      create_github_release:
        description: 'Create a GitHub Release & Tag?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-release:
    name: Build & Package Plugin Zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v6

      - name: Resolve Version Number
        id: version
        run: |
          # A tag push wins (refs/tags/v0.3.0 -> 0.3.0), then the manual override,
          # then the Version header in the main plugin file.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${{ github.event.inputs.version_override }}"
          else
            VERSION=$(grep -m 1 "Version:" gnn-ipinfo.php | awk '{print $NF}' | tr -d '\r')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version resolved: $VERSION"

      - name: Prepare Clean Plugin Package Directory
        run: |
          # The plugin code lives at the repo root, so copy from there into a single
          # gnn-ipinfo/ folder and leave every repo-meta path behind. Zipping the repo
          # root as-is would double-nest the plugin and break WordPress detection.
          mkdir -p dist/gnn-ipinfo
          rsync -av \
            --exclude='dist' \
            --exclude='build' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='agents' \
            --exclude='tasks' \
            --exclude='docs' \
            --exclude='specs' \
            --exclude='memory-bank' \
            --exclude='archive' \
            --exclude='*.md' \
            ./ dist/gnn-ipinfo/
          # CHANGELOG.md is the only Markdown file that ships with the plugin.
          cp CHANGELOG.md dist/gnn-ipinfo/
          ls -R dist/gnn-ipinfo

      - name: Create Zip Archive
        run: |
          cd dist
          zip -r "../gnn-ipinfo-v${VERSION}.zip" gnn-ipinfo
          cd ..
          ls -lh "gnn-ipinfo-v${VERSION}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gnn-ipinfo-v${{ env.VERSION }}
          path: gnn-ipinfo-v${{ env.VERSION }}.zip
          retention-days: 90

      - name: Create GitHub Release & Attach Zip
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## GNN IPinfo v${{ env.VERSION }}
            - Displays visitor IP information using the IPinfo.io API.
            - Clean, production-ready plugin zip package attached.
          files: gnn-ipinfo-v${{ env.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
