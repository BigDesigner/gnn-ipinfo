name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version override (e.g. 0.3.2). Leave empty to read the version from gnn-ipinfo/gnn-ipinfo.php.'
        required: false
        default: ''
      create_github_release:
        description: 'Create a GitHub Release & Tag?'
        required: true
        type: boolean
        default: true

jobs:
  build-and-release:
    name: Build & Package Plugin Zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Lint PHP Files
        run: |
          find gnn-ipinfo -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Resolve & Validate Version Number
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          HEADER_VERSION=$(grep -m 1 "Version:" gnn-ipinfo/gnn-ipinfo.php | awk '{print $NF}' | tr -d '\r')

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            if [ -n "$HEADER_VERSION" ] && [ "$VERSION" != "$HEADER_VERSION" ]; then
              echo "Error: Tag version ($VERSION) does not match plugin header Version ($HEADER_VERSION)."
              exit 1
            fi
          elif [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
          else
            VERSION="$HEADER_VERSION"
          fi

          if [ -z "$VERSION" ] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Invalid or empty resolved version: '$VERSION'"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version resolved: $VERSION"

      - name: Prepare Clean Plugin Package Directory
        run: |
          # The plugin source lives in gnn-ipinfo/, so copy only that folder. Repo-meta
          # paths (.github, agents, tasks, docs, memory-bank, *.md) stay at the repo root
          # and are therefore never packaged.
          mkdir -p dist/gnn-ipinfo
          cp -a gnn-ipinfo/. dist/gnn-ipinfo/
          # CHANGELOG.md lives at the repo root but ships with the plugin.
          cp CHANGELOG.md dist/gnn-ipinfo/
          ls -R dist/gnn-ipinfo

      - name: Create Zip Archive
        run: |
          cd dist
          zip -r "../gnn-ipinfo-v${VERSION}.zip" gnn-ipinfo
          cd ..
          ls -lh "gnn-ipinfo-v${VERSION}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: gnn-ipinfo-v${{ env.VERSION }}
          path: gnn-ipinfo-v${{ env.VERSION }}.zip
          retention-days: 90

      - name: Create GitHub Release & Attach Zip
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_github_release == true || github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## GNN IPinfo v${{ env.VERSION }}
            - Displays visitor IP information using the IPinfo.io API.
            - Clean, production-ready plugin zip package attached.
          files: gnn-ipinfo-v${{ env.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
